services:
  # Backend FastAPI Service (Docker)
  - type: web
    name: railway-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: railway-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: railway-redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
      - key: GEMINI_API_KEY
        sync: false

  # Managed Key-Value Store (Redis)
  - type: keyvalue
    name: railway-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # Managed PostgreSQL Database
  - name: railway-db
    plan: free
    databaseName: railway_ai
    user: railway
    region: singapore
