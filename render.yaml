services:
  # Backend FastAPI Service (Docker)
  - type: web
    name: railway-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: railway-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: railway-redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
      - key: GEMINI_API_KEY
        sync: false

  # Optional Frontend Static Site (can also be deployed on Vercel)
  - type: web
    name: railway-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: railway-backend
          property: host

databases:
  - name: railway-db
    plan: free
    databaseName: railway_ai
    user: railway
    region: oregon

  - name: railway-redis
    plan: free
    region: oregon
