services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: railway_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railway_ai}
      POSTGRES_USER: ${POSTGRES_USER:-railway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railway123}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - railway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-railway} -d ${POSTGRES_DB:-railway_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - railway-net

  redis:
    image: redis:7-alpine
    container_name: railway_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - railway_redis_data:/data
    networks:
      - railway-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railway_backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-railway}:${POSTGRES_PASSWORD:-railway123}@postgres:5432/${POSTGRES_DB:-railway_ai}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-railway_secret_key_super_secure_change_in_production_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - railway-net

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railway_celery_beat
    restart: unless-stopped
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-railway}:${POSTGRES_PASSWORD:-railway123}@postgres:5432/${POSTGRES_DB:-railway_ai}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-railway_secret_key_super_secure_change_in_production_2026}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - backend
    networks:
      - railway-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railway_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - railway-net

volumes:
  railway_postgres_data:
  railway_redis_data:

networks:
  railway-net:
    driver: bridge
